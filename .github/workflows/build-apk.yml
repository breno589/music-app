name: Compilar SonsPlayer V3
on:
  workflow_dispatch:
  push:
    branches: [sonsplayer-v3-build]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Usando: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restaurar código-fonte
        run: cat sources/chunk_*.txt | base64 -d | xz -d | tar -x
      - name: Gerar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SonsPlayer-V3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
