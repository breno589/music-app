name: Compilar SonsPlayer V3
on:
  workflow_dispatch:
  push:
    branches: [sonsplayer-v3-build]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Usando: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restaurar código-fonte
        run: cat sources/chunk_*.txt | base64 -d | xz -d | tar -x
      - name: Instalar YouTube e equalizador V3.1
        run: python3 enhancements/install_v31.py
      - name: Atualizar sintaxe do Kotlin Gradle
        shell: bash
        run: |
          sed -i '/kotlinOptions { jvmTarget = "17" }/d' app/build.gradle.kts
          printf '\nkotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) } }\n' >> app/build.gradle.kts
      - name: Gerar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SonsPlayer-V3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK para download direto no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SonsPlayer_V3_1_YouTube_EQ.apk
          if gh release view "v3.1.0" >/dev/null 2>&1; then
            gh release upload "v3.1.0" SonsPlayer_V3_1_YouTube_EQ.apk --clobber
          else
            gh release create "v3.1.0" SonsPlayer_V3_1_YouTube_EQ.apk --target "$GITHUB_SHA" --title "SonsPlayer V3.1 - YouTube e Equalizador" --notes "APK Android debug. YouTube dentro do aplicativo e equalizador para músicas locais; recurso ainda não testado em celular físico."
          fi
